name: Bug report
description: Something did not work, or a download went wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. Please do not post a licence key, a password or anything private here.
        For keys and payments, write to support@novabyteworks.com.
  - type: dropdown
    id: site
    attributes:
      label: Which site?
      options:
        - "Pinterest"
        - "Reddit"
        - "X"
        - "Bluesky"
        - "Tumblr"
        - "Threads"
        - "Facebook"
        - "VSCO"
        - "Clip & GIF"
        - "My Library"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw. Please copy any message the panel showed.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: What were you saving?
      description: The kind of page, for example "a Pinterest board with two sections", "a subreddit" or "my X bookmarks". A link helps if the page is public.
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown on chrome://extensions, next to the extension's name.
      placeholder: "2.1.3"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and computer
      placeholder: "Chrome 142 on Windows 11"
    validations:
      required: true
  - type: dropdown
    id: plan
    attributes:
      label: Your plan
      options:
        - "Free"
        - "All sites, monthly"
        - "All sites, lifetime"
        - "A key for one site"
        - "Golden key"
        - "Not sure"
